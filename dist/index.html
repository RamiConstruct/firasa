<style>
:root{
  --bg:#0b0f14; --bg2:#0f141b; --panel:#131a23; --panel2:#18212c; --line:#222c39; --line2:#2c3847;
  --text:#ece6da; --muted:#8c96a5; --dim:#5d6878;
  --up:#2bc8a4; --down:#f0565e; --gold:#d4a24c; --blue:#5aa9ff; --violet:#b28dff; --cyan:#4dd0e1;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif; --serif:Fraunces,Georgia,serif;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
body{min-height:100vh;background:radial-gradient(1200px 500px at 80% -10%,rgba(212,162,76,.08),transparent 60%),radial-gradient(900px 400px at -10% 10%,rgba(43,200,164,.05),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 14px calc(190px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit}
.brand b{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.2px}
.brand span{font-size:17px;color:var(--gold);font-family:serif}
.brand small{color:var(--muted);font-size:12px}
.hbtn{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted)}
.hbtn:hover{color:var(--text);border-color:var(--gold)}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,6vw,44px);line-height:1.08;margin:8px 0 10px;letter-spacing:-.3px}
h1 em{font-style:normal;color:var(--gold)}
h2{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 10px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:0 0 10px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{color:var(--text);border-color:var(--gold);background:rgba(212,162,76,.1)}
.chip:disabled{opacity:.35;cursor:default}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting label{font-weight:500}
.setting .hint{display:block;font-size:12px;color:var(--muted);font-weight:400}
.tog{position:relative;width:46px;height:27px;border-radius:99px;background:var(--line2);border:0;flex:none;transition:.2s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--text);transition:.2s}
.tog.on{background:var(--gold)} .tog.on::after{left:22px;background:#1a1408}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--gold);color:#1a1408;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text);font-weight:600}
.btn:disabled{opacity:.4}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--mono);font-size:21px}
.kpi span{font-size:12px;color:var(--muted)}
.feature{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.feature div{font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding:2px 0 2px 10px}
.feature b{color:var(--text);display:block;font-size:14px}
/* jeu */
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}
.prog{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.gstat{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.gstat b{color:var(--text)}
.ctxline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px;gap:8px}
.ctxline b{color:var(--text);font-weight:600}
.chartbox{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#chart{display:block;width:100%;height:clamp(300px,calc(100svh - 405px),560px);touch-action:pan-y}
.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools .sep{width:1px;background:var(--line2);flex:none;margin:2px 4px}
.guess{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(11,15,20,0),rgba(11,15,20,.97) 18%);padding:16px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}
.guess .in{max-width:980px;margin:0 auto}
.guess .q{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;gap:8px}
.hs{font-size:12px;margin-top:3px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gb{border:0;border-radius:14px;padding:16px 10px;font-size:18px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px}
.gb.u{background:var(--up);color:#04241c} .gb.d{background:var(--down);color:#2b0507}
.gb:disabled{opacity:.35}
.gb:active{transform:scale(.98)}
.seg.conf button{padding:5px 9px;font-size:12.5px}
.result{border-width:1px;border-style:solid}
.result.ok{border-color:rgba(43,200,164,.5);background:linear-gradient(180deg,rgba(43,200,164,.10),var(--bg2))}
.result.ko{border-color:rgba(240,86,94,.5);background:linear-gradient(180deg,rgba(240,86,94,.10),var(--bg2))}
.result .big{font-family:var(--serif);font-size:28px;font-weight:700;margin:0 0 2px}
.verdict p{margin:8px 0 0}
.lesson{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.lesson b{color:var(--gold)}
.sigs{display:flex;flex-direction:column;gap:6px}
.sig{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.sig .ar{font-weight:800;text-align:center;line-height:1.3}
.sig .lb{font-weight:600;font-size:14px}
.sig .rd{font-size:13px;color:var(--muted)}
.sig .ls{grid-column:2/4;font-size:13px;color:var(--text);opacity:.85;display:none;border-top:1px dashed var(--line2);padding-top:6px;margin-top:2px}
.sig.open .ls{display:block}
.sig .ck{font-size:13px;font-weight:700;font-family:var(--mono)}
.ar.p{color:var(--up)} .ar.n{color:var(--down)} .ar.z{color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:820px){.grid2{grid-template-columns:1.15fr .85fr}}
.book .lvl{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;align-items:center;margin:7px 0;font-size:12px}
.book .bar{height:22px;border-radius:6px;position:relative;background:var(--bg);overflow:hidden}
.book .bar i{position:absolute;top:0;bottom:0}
.book .bid i{right:0;background:rgba(43,200,164,.55)} .book .ask i{left:0;background:rgba(240,86,94,.55)}
.book .bar span{position:absolute;top:3px;font-family:var(--mono);font-size:11.5px}
.book .bid span{left:6px} .book .ask span{right:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap} th.n{text-align:right}
.bigscore{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.bigscore b{font-family:var(--serif);font-size:64px;line-height:.95}
.tips li{margin:6px 0}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:10px 14px;border-radius:10px;font-size:14px;z-index:50;display:none}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;background:rgba(15,20,27,.6)}
.foot{color:var(--dim);font-size:12px;text-align:center;margin:26px 0 0}
.foot a{color:var(--muted)}
.hide{display:none!important}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
@media(max-width:430px){.hbtn{padding:7px 10px;font-size:12.5px}}
.credit{margin:-6px 2px 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.credit b{color:var(--text);font-weight:600}
.credit i{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:15px;padding:0 1px}
.credit .dot{color:var(--gold);font-size:7px;margin:0 8px;vertical-align:2px}
@media(max-width:560px){.credit .d2{display:none}.credit .more{display:block;font-size:12px}}
.soon{display:flex;align-items:center;gap:10px;border:1px solid rgba(212,162,76,.45);background:linear-gradient(90deg,rgba(212,162,76,.15),rgba(212,162,76,.03));border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.soon .pill{background:var(--gold);color:#1a1408;font-weight:700;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;border-radius:99px;padding:3px 9px;flex:none}

.pgrid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:760px){.pgrid{grid-template-columns:1fr 1fr}}
.pc table td{vertical-align:top}
.day .ev{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.day .ev:first-of-type{border-top:0}
.day .ev>div{grid-column:1/4}
.tagr{font-size:11.5px;border:1px solid var(--line2);border-radius:99px;padding:1px 8px;white-space:nowrap}
.tagr.gold{border-color:var(--gold);color:var(--gold)}
.live-btn{border-color:rgba(240,86,94,.5)!important}
.blink{animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.25}}
.call{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.call:first-of-type{border-top:0}
.ladder{font-family:var(--mono);font-size:12px}
.lrow{position:relative;display:flex;justify-content:space-between;padding:2px 6px;margin:1px 0;border-radius:4px;overflow:hidden}
.lrow i{position:absolute;top:0;bottom:0;right:0;z-index:0}
.lrow span{position:relative;z-index:1}
.lrow.bid i{background:rgba(43,200,164,.22)} .lrow.ask i{background:rgba(240,86,94,.22)}
.lrow.bid span:first-child{color:var(--up)} .lrow.ask span:first-child{color:var(--down)}
.lmid{text-align:center;color:var(--muted);padding:5px 0;border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2);margin:3px 0}

@media(max-width:430px){.brand small{display:none}}
#langBtn{font-weight:600;letter-spacing:.5px}
</style>
</head>

    const e12 = ema(c, 12), e26 = ema(c, 26);
    I.macd = e12.map((x, i) => x - e26[i]); I.macdSig = ema(I.macd, 9); I.macdHist = I.macd.map((x, i) => x - I.macdSig[i]);
    I.volSma = sma(v, 20);
    I.delta = v.map((x, i) => 2 * tb[i] - x);
    I.vwap = NaNs(n); I.cvd = NaNs(n);
    let pv = 0, vv = 0, cd = 0;
    for (let i = visStart; i < n; i++) { const tp = (h[i] + l[i] + c[i]) / 3; pv += tp * v[i]; vv += v[i]; cd += I.delta[i]; I.vwap[i] = vv ? pv / vv : c[i]; I.cvd[i] = cd; }
    return I;
  }

  // Profil de volume sur [a, b] : zones de liquidité (POC, zone de valeur 70 %)
  function volumeProfile(R, a, b, bins = 36) {
    let lo = Infinity, hi = -Infinity;
    for (let i = a; i <= b; i++) { lo = Math.min(lo, R.l[i]); hi = Math.max(hi, R.h[i]); }
    const size = (hi - lo) / bins || 1, vol = new Array(bins).fill(0);
    for (let i = a; i <= b; i++) {
      const b0 = Math.max(0, Math.min(bins - 1, Math.floor((R.l[i] - lo) / size)));
      const b1 = Math.max(0, Math.min(bins - 1, Math.floor((R.h[i] - lo) / size)));
      const share = R.vol[i] / (b1 - b0 + 1);
      for (let k = b0; k <= b1; k++) vol[k] += share;
    }
    let poc = 0; for (let k = 1; k < bins; k++) if (vol[k] > vol[poc]) poc = k;
    const total = vol.reduce((s, x) => s + x, 0);
    let inside = vol[poc], up = poc, dn = poc;
    while (inside < total * 0.7 && (up < bins - 1 || dn > 0)) {
      const nu = up < bins - 1 ? vol[up + 1] : -1, nd = dn > 0 ? vol[dn - 1] : -1;
      if (nu >= nd) { up++; inside += nu; } else { dn--; inside += nd; }
    }
    return { lo, hi, size, vol, poc: lo + (poc + 0.5) * size, vah: lo + (up + 1) * size, val: lo + dn * size, max: vol[poc] };
  }

  // Sommets / creux confirmés (k bougies de chaque côté, tous ≤ fin)
  function pivots(R, a, end, k = 3) {
    const highs = [], lows = [];
    for (let i = a + k; i <= end - k; i++) {
      let isH = true, isL = true;
      for (let j = i - k; j <= i + k; j++) { if (R.h[j] > R.h[i]) isH = false; if (R.l[j] < R.l[i]) isL = false; }
      if (isH) highs.push(i); if (isL) lows.push(i);
    }
    return { highs, lows };
  }

}

// ---------- réseau ----------
const queue = [];
let fetching = 0;
const sigOf = () => set().tfs.join(',') + '|' + (set().book ? 1 : 0) + '|' + (set().blind ? 1 : 0);
async function fetchRound() {
  const s = set();
  const u = `/api/round?tfs=${s.tfs.join(',')}${s.book ? '&book=1' : ''}${s.blind ? '&blind=1' : ''}&r=${Math.random().toString(36).slice(2)}`;
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(u); if (r.ok) { const d = await r.json(); if (!d.error) return d; } } catch (e) {}
    await new Promise(r => setTimeout(r, 600 * (i + 1)));
  }
  throw new Error('network');
}
function refill() {
  while (queue.length + fetching < 2) {
    fetching++; const sig = sigOf();
    fetchRound().then(d => queue.push({ sig, d, at: Date.now() })).catch(() => {}).finally(() => { fetching--; });
  }
}
function takeQueued() {
  while (queue.length) { const q = queue.shift(); if (q.sig === sigOf() && Date.now() - q.at < 2400000) return q.d; }
  return null;
}
async function nextRound() {
  refill();
  for (let i = 0; i < 80; i++) {
    const d = takeQueued(); if (d) { refill(); return d; }
    if (!fetching) refill();
    await new Promise(r => setTimeout(r, 150));
  }
  try { return await fetchRound(); } catch (e) { return null; }
}

const dayStr = sec => new Date(sec * 1000).toISOString().slice(0, 10);

  }

    }).join('');
  } else {

    evHtml = `<p class="small" style="margin:0">${t.evNone}</p>` + (prev ? `<p class="small muted" style="margin:6px 0 0">${t.evLast(Math.round((ms(last) - ms(prev[0])) / 864e5), txt(prev))}</p>` : '');
  }

    <p class="small muted" style="margin:8px 0 0">${t.evNote}</p></section>`;
}

  const edge = G.S.pUp - 0.5;
  const c = { id: Date.now(), s: R.sym, tf: R.tf, h: s.liveH, g, cf: s.conf, p0: R.c[R.ctx - 1], t0: Date.now(), dl: Date.now() + s.liveH * LIVE_TF[R.tf] * 1000, sig, cs: Math.abs(edge) < 0.02 ? 0 : Math.sign(edge) };

function scheduleCall(c) { setTimeout(() => resolveCall(c), Math.max(0, c.dl - Date.now()) + 1200); }

  } catch (e) { p1 = null; }

  const rec = { s: c.s, tf: c.tf, h: c.h, g: c.g, cf: c.cf, out, ok: out !== 0 && out === c.g, mv: +mv.toFixed(4), cs: c.cs, sig: c.sig, t: Math.floor(c.t0 / 1000), p0: c.p0, p1, live: true };

}

  el.innerHTML = `<h3>${t.openCalls}</h3>${open.length ? open.map(c => `<div class="call">${arrow(c.g)} <b>${c.s}</b> ${c.tf} ×${c.h} · ${t.entry} <span class="mono">${priceTxt(c.p0)}</span>${live(c)}<span class="mono" style="margin-left:auto">${t.left} ${countdown(c.dl)}</span></div>`).join('') : `<p class="small muted" style="margin:0">${t.noOpen}</p>`}
  ${done.length ? `<h3 style="margin-top:14px">${t.lastRes}</h3>${done.map(r => `<div class="call">${arrow(r.g)} <b>${r.s}</b> ${r.tf} ×${r.h} · <span class="mono ${r.mv >= 0 ? 'up' : 'down'}">${fmtPct(r.mv, 3)}</span><b style="margin-left:auto" class="${r.ok ? 'up' : 'down'}">${r.out === 0 ? '=' : r.ok ? t.right : t.wrong}</b></div>`).join('')}` : ''}`;
}
function drawCalls(X, Y, D, cw, W, padR) {
